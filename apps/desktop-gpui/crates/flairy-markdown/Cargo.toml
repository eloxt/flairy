[package]
name = "flairy-markdown"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = "0.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
linkify = "0.10"
# Pure-Rust regex engine (fancy) — no C toolchain, Windows-friendly.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
