[package]
name = "flairy-ai"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
flairy-contract = { path = "../../../../crates/flairy-contract" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-openai = "0.28"
