# Re-sign dev binaries with the stable local "flairy-dev" identity before
# running. Cargo's ad-hoc (linker) signature changes on every rebuild, so the
# macOS keychain treats each build as a brand-new app and re-prompts for
# credential access; a certificate-based signature with a fixed identifier
# keeps one "Always Allow" grant valid forever.
#
# One-time setup per machine (no-ops gracefully when the identity is absent):
#   openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 3650 -nodes \
#     -subj "/CN=flairy-dev" -addext "keyUsage=critical,digitalSignature" \
#     -addext "extendedKeyUsage=critical,codeSigning" -addext "basicConstraints=critical,CA:false"
#   openssl pkcs12 -export -legacy -out dev.p12 -inkey key.pem -in cert.pem -passout pass:x -name flairy-dev
#   security import dev.p12 -k ~/Library/Keychains/login.keychain-db -P x -T /usr/bin/codesign
[target.aarch64-apple-darwin]
runner = ['/bin/sh', '-c', 'if security find-identity -p codesigning 2>/dev/null | grep -q flairy-dev; then codesign -f -s flairy-dev --identifier com.flairy.dev "$0" 2>/dev/null || true; fi; exec "$0" "$@"']
