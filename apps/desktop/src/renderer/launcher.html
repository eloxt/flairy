<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- img-src allows https: like the main window: the launcher renders the
         same message list, so citation favicons must be able to hot-link. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;"
    />
    <title>Flairy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/launcher.tsx"></script>
  </body>
</html>
